{% extends "base.html" %}

{% block content %}
<div class="nuova-layout">
<section class="upload-card" aria-label="Carica una lezione">
  <div id="form-error" class="form-error" hidden role="alert"></div>

  <form id="upload-form" novalidate>
    <div class="field">
      <label class="field__label" for="dropzone-input">File audio</label>
      <label id="dropzone" class="dropzone" for="dropzone-input">
        <input
          id="dropzone-input"
          class="dropzone__input"
          type="file"
          name="file"
          accept=".m4a,.mp3,.wav,.ogg,.opus,.flac,.webm,.aac"
        />
        <span id="dropzone-prompt" class="dropzone__prompt">
          Trascina un file qui, o scegli dal disco.
          <span class="dropzone__hint">m4a, mp3, wav, ogg, opus, flac, webm, aac</span>
        </span>
        <span id="dropzone-file" class="dropzone__file" hidden>
          <span id="dropzone-file-name" class="dropzone__file-name"></span>
          <span id="dropzone-file-size" class="dropzone__file-size"></span>
          <span class="dropzone__change">Cambia file</span>
        </span>
      </label>
      <p id="file-error" class="field__error" hidden></p>
    </div>

    <div class="checkbox-field">
      <input id="correct" type="checkbox" name="correct" />
      <label for="correct">Correggi con Ollama dopo la trascrizione</label>
    </div>

    <div class="field">
      <label class="field__label" for="ollama_model">Modello Ollama</label>
      <input
        id="ollama_model"
        class="text-input"
        type="text"
        name="ollama_model"
        value="{{ defaults.ollama_model }}"
        disabled
      />
      <p class="field__helper">Usato solo se la correzione è attiva.</p>
      <p id="ollama_model-error" class="field__error" hidden></p>
    </div>

    <div class="field">
      <label class="field__label" for="subject">Materia</label>
      <input
        id="subject"
        class="text-input"
        type="text"
        name="subject"
        maxlength="100"
        placeholder="Es. Analisi matematica"
      />
      <p id="subject-error" class="field__error" hidden></p>
    </div>

    <details class="disclosure">
      <summary>Impostazioni avanzate</summary>
      <div class="disclosure__body">
        <div class="field">
          <label class="field__label" for="whisper_model">Modello Whisper</label>
          <select id="whisper_model" class="select-input" name="whisper_model">
            <option value="auto" selected>Automatico</option>
            {% for model in whisper_models %}
            <option value="{{ model }}">{{ model }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field">
          <label class="field__label" for="beam_size">Beam size (1-10)</label>
          <input
            id="beam_size"
            class="text-input"
            type="number"
            name="beam_size"
            min="1"
            max="10"
            step="1"
            value="{{ defaults.beam_size }}"
          />
          <p id="beam_size-error" class="field__error" hidden></p>
        </div>

        <div class="checkbox-field">
          <input
            id="vad_filter"
            type="checkbox"
            name="vad_filter"
            {% if defaults.vad_filter %}checked{% endif %}
          />
          <label for="vad_filter">Filtro VAD (rilevamento voce)</label>
        </div>

        <div class="checkbox-field">
          <input
            id="condition_on_previous_text"
            type="checkbox"
            name="condition_on_previous_text"
            {% if defaults.condition_on_previous_text %}checked{% endif %}
          />
          <label for="condition_on_previous_text">Condiziona sul testo precedente</label>
        </div>

        <div class="field">
          <label class="field__label" for="uncertain_threshold">Soglia di incertezza (0-1)</label>
          <input
            id="uncertain_threshold"
            class="text-input"
            type="number"
            name="uncertain_threshold"
            min="0"
            max="1"
            step="0.05"
            value="{{ defaults.uncertain_threshold }}"
          />
          <p id="uncertain_threshold-error" class="field__error" hidden></p>
        </div>
      </div>
    </details>

    <button id="submit-button" class="btn btn--primary" type="submit">
      <span class="btn__label">Trascrivi</span>
    </button>
  </form>
</section>

<section class="queue-section" aria-labelledby="queue-heading">
  <h2 id="queue-heading" class="section-title">Coda</h2>
  <div id="queue" class="queue" aria-live="polite"></div>
</section>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/jobs.js" defer></script>
{% endblock %}
