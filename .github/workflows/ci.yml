---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      badges: ${{ steps.upload-badges.outcome == 'success' }}
    steps:
      - name: Check out the code
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        # astral-sh/setup-uv v10.2.0
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      # --locked fails when uv.lock is out of date with pyproject.toml.
      # No "cuda" extra: the tests mock faster-whisper and never touch a GPU.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        id: test
        run: >-
          uv run pytest --cov=sbobina --cov-branch
          --cov-report=json:coverage.json --junitxml=junit.xml

      # Runs after a red test step too, so the test badge shows the failures.
      - name: Write badges
        id: badges
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: >-
          uv run python scripts/write_badges.py
          --junit junit.xml --coverage coverage.json --out badges

      - name: Upload badges
        id: upload-badges
        if: ${{ !cancelled() && steps.badges.outcome == 'success' }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: badges
          path: badges/
          retention-days: 1

  # The only job that can write: it commits to the generated "badges" branch,
  # which the README reads through shields.io. Never runs for pull requests.
  publish-badges:
    needs: check
    if: >-
      ${{ !cancelled() && needs.check.outputs.badges == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download badges
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: badges
          path: new-badges

      # Adds a commit on top of the branch (created on the first run) and only
      # when a badge changed, so no history is ever rewritten.
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git init --quiet --initial-branch=badges site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --quiet --depth=1 "$remote" badges; then
            git reset --quiet --hard FETCH_HEAD
          fi
          mkdir -p badges
          cp ../new-badges/*.json badges/
          git add badges
          if git diff --cached --quiet; then
            echo "Badges unchanged"
            exit 0
          fi
          git commit --quiet --message "chore: update badges"
          git push --quiet "$remote" badges:badges
